{% extends "base.html" %}
{% load static %}

{% block title %}حذف جلسه{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3 class="card-title mb-0">حذف جلسه</h3>
                </div>
                <div class="card-body">
                    <p class="lead">آیا از حذف جلسه "{{ meeting.title }}" اطمینان دارید؟</p>
                    <p>این عملیات قابل بازگشت نیست.</p>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'meetings:meeting_list' %}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> انصراف
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
