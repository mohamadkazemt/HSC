{% if field and field.errors %}
<div class="flex items-start gap-2 rounded-2xl border border-red-200 bg-red-50/70 px-3 py-2 text-xs text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-200" data-field-error="true">
    <i class="fa-solid fa-circle-exclamation text-sm leading-5 text-red-500 dark:text-red-300 mt-0.5"></i>
    <ul class="space-y-1">
        {% for error in field.errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
