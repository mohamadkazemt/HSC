<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آفلاین - HSC</title>
    <style>
        body {
            font-family: 'Vazir', 'Tahoma', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .offline-container {
            background: rgba(255,255,255,0.1);
            padding: 3rem 2rem;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
        }
        
        .offline-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        h1 {
            font-size: 2rem;
            margin: 1rem 0;
            font-weight: 700;
        }
        
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .retry-btn, .home-btn {
            background: rgba(255,255,255,0.9);
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
            text-decoration: none;
            display: inline-block;
            font-size: 1rem;
        }
        
        .retry-btn:hover, .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background: white;
        }
        
        .features {
            margin-top: 2rem;
            text-align: right;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin: 0.5rem 0;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .feature-icon {
            margin-left: 10px;
            font-size: 1.2rem;
        }
        
        @media (max-width: 768px) {
            .offline-container {
                padding: 2rem 1.5rem;
            }
            
            .offline-icon {
                font-size: 4rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <h1>اتصال اینترنت قطع است</h1>
        <p>
            متأسفانه در حال حاضر اتصال اینترنت برقرار نیست.<br>
            لطفاً اتصال خود را بررسی کرده و مجدد تلاش کنید.
        </p>
        
        <div>
            <button class="retry-btn" onclick="location.reload()">تلاش مجدد</button>
            <a href="/" class="home-btn">صفحه اصلی</a>
        </div>
        
        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">💾</span>
                برخی از محتوای کش شده در دسترس است
            </div>
            <div class="feature-item">
                <span class="feature-icon">🔄</span>
                صفحه به صورت خودکار بروزرسانی خواهد شد
            </div>
            <div class="feature-item">
                <span class="feature-icon">⚡</span>
                بارگذاری سریع پس از برقراری اتصال
            </div>
        </div>
    </div>

    <script>
        // Auto refresh when online
        window.addEventListener('online', () => {
            location.reload();
        });
        
        // Check connection status
        function checkConnection() {
            if (navigator.onLine) {
                location.reload();
            }
        }
        
        // Check every 30 seconds
        setInterval(checkConnection, 30000);
        
        // Show network status
        const retryBtn = document.querySelector('.retry-btn');
        if (!navigator.onLine) {
            retryBtn.textContent = 'آفلاین - ' + retryBtn.textContent;
            retryBtn.style.opacity = '0.7';
        }
    </script>
</body>
</html>
