<!--  pagination.html  -->
<nav aria-label="Page navigation" class="mt-3">
    <ul class="pagination justify-content-center">
        {% if page.has_previous %}
            <li class="page-item">
                <a class="page-link"
                   href="?tab={{ tab }}&page_{{tab}}=1&items_per_page={{items_per_page}}&order_by_{{tab}}={{order_by}}&direction_{{tab}}={{direction}}{% if request.GET.start_date %}&start_date={{ request.GET.start_date }}{% endif %}{% if request.GET.end_date %}&end_date={{ request.GET.end_date }}{% endif %}"
                   aria-label="First">
                    <span aria-hidden="true">««</span>
                </a>
            </li>
            <li class="page-item">
                <a class="page-link"
                   href="?tab={{ tab }}&page_{{tab}}={{ page.previous_page_number }}&items_per_page={{items_per_page}}&order_by_{{tab}}={{order_by}}&direction_{{tab}}={{direction}}{% if request.GET.start_date %}&start_date={{ request.GET.start_date }}{% endif %}{% if request.GET.end_date %}&end_date={{ request.GET.end_date }}{% endif %}"
                   aria-label="Previous">
                    <span aria-hidden="true">«</span>
                </a>
            </li>
        {% endif %}

        {% for i in paginator.page_range %}
            <li class="page-item {% if page.number == i %}active{% endif %}">
                <a class="page-link"
                   href="?tab={{ tab }}&page_{{tab}}={{ i }}&items_per_page={{items_per_page}}&order_by_{{tab}}={{order_by}}&direction_{{tab}}={{direction}}{% if request.GET.start_date %}&start_date={{ request.GET.start_date }}{% endif %}{% if request.GET.end_date %}&end_date={{ request.GET.end_date }}{% endif %}">{{ i }}</a>
            </li>
        {% endfor %}

        {% if page.has_next %}
            <li class="page-item">
                <a class="page-link"
                   href="?tab={{ tab }}&page_{{tab}}={{ page.next_page_number }}&items_per_page={{items_per_page}}&order_by_{{tab}}={{order_by}}&direction_{{tab}}={{direction}}{% if request.GET.start_date %}&start_date={{ request.GET.start_date }}{% endif %}{% if request.GET.end_date %}&end_date={{ request.GET.end_date }}{% endif %}"
                   aria-label="Next">
                    <span aria-hidden="true">»</span>
                </a>
            </li>
            <li class="page-item">
                <a class="page-link"
                   href="?tab={{ tab }}&page_{{tab}}={{ paginator.num_pages }}&items_per_page={{items_per_page}}&order_by_{{tab}}={{order_by}}&direction_{{tab}}={{direction}}{% if request.GET.start_date %}&start_date={{ request.GET.start_date }}{% endif %}{% if request.GET.end_date %}&end_date={{ request.GET.end_date }}{% endif %}"
                   aria-label="Last">
                    <span aria-hidden="true">»»</span>
                </a>
            </li>
        {% endif %}
    </ul>
</nav>
