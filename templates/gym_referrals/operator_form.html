{% extends "base.html" %}{% block title %}افزودن اپراتور{% endblock %}{% block content %}<div class="mx-auto max-w-3xl space-y-6"><h1 class="text-2xl font-bold">افزودن اپراتور{% if gym %} برای {{ gym.name }}{% endif %}</h1><form method="post" class="space-y-5 rounded-xl border bg-white p-6 dark:border-gray-700 dark:bg-gray-800">{% csrf_token %}{% for field in form %}<div><label class="mb-2 block">{{ field.label }}</label>{{ field }}{% for e in field.errors %}<p class="text-red-600">{{ e }}</p>{% endfor %}</div>{% endfor %}<button class="rounded bg-indigo-600 px-4 py-2 text-white">ثبت اپراتور</button></form></div>{% endblock %}
