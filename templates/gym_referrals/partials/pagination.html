{% if page_obj.has_other_pages %}<nav class="flex items-center justify-between border-t p-4 text-sm dark:border-gray-700"><span>صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span><div class="flex gap-2">{% if page_obj.has_previous %}<a class="rounded border px-3 py-1" href="?page={{ page_obj.previous_page_number }}">قبلی</a>{% endif %}{% if page_obj.has_next %}<a class="rounded border px-3 py-1" href="?page={{ page_obj.next_page_number }}">بعدی</a>{% endif %}</div></nav>{% endif %}
