{% extends 'base.html' %}
{% block title %}دسترسی غیرمجاز{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-white dark:bg-gray-800 rounded-xl shadow p-6 text-center">
  <div class="mx-auto mb-4 h-12 w-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3h.008v.008H12V15.75Z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z" />
    </svg>
  </div>
  <h1 class="text-lg font-bold mb-2">دسترسی غیرمجاز</h1>
  <p class="text-sm text-gray-600 dark:text-gray-300">شما مجوز دسترسی به این بخش را ندارید.</p>
  <div class="mt-6 flex items-center justify-center gap-3">
    <a href="/" class="px-4 py-2 rounded bg-indigo-600 text-white hover:bg-indigo-700">بازگشت به داشبورد</a>
    {% if not user.is_authenticated %}
    <a href="{% url 'accounts:login' %}" class="px-4 py-2 rounded border">ورود</a>
    {% endif %}
  </div>
</div>
{% endblock %}
