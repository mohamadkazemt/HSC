<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تکمیل بازیابی رمز عبور - پورتال اورژانس</title>
    
    {% load static %}
    <!-- Vazirmatn Font -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .emergency-gradient {
            background: linear-gradient(135deg, #dc2626 0%, #ef4444 50%, #f87171 100%);
        }
        @keyframes checkmark {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .checkmark-icon {
            animation: checkmark 0.5s ease-in-out;
        }
    </style>
</head>
<body class="font-sans gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo/Header Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-white rounded-full shadow-2xl mb-4 checkmark-icon">
                <i class="fas fa-check-circle text-5xl text-green-600"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">موفق!</h1>
            <p class="text-white/80 text-lg">پورتال اورژانس</p>
        </div>

        <!-- Success Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">رمز عبور با موفقیت تغییر یافت</h2>
                <p class="text-gray-600 mb-8">
                    رمز عبور شما با موفقیت تنظیم شد. اکنون می‌توانید با رمز عبور جدید وارد سیستم شوید.
                </p>
                
                <!-- Success Icon Animation -->
                <div class="mb-8 flex justify-center">
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-check text-4xl text-green-600"></i>
                    </div>
                </div>

                <!-- Login Button -->
                <a 
                    href="{% url 'emergency_services:emergency_login' %}" 
                    class="inline-flex items-center gap-2 emergency-gradient text-white font-bold py-3 px-8 rounded-lg hover:shadow-lg transition-all duration-300"
                >
                    <i class="fas fa-sign-in-alt"></i>
                    <span>ورود به سیستم</span>
                </a>

                <!-- Additional Info -->
                <div class="mt-6 pt-6 border-t border-gray-200">
                    <p class="text-sm text-gray-600">
                        <i class="fas fa-shield-alt ml-1 text-blue-500"></i>
                        از رمز عبور خود به خوبی محافظت کنید
                    </p>
                </div>
            </div>
        </div>

        <!-- Additional Info -->
        <div class="mt-6 text-center text-white/80 text-sm">
            <p>© 2025 سامانه مدیریت HSE - تمامی حقوق محفوظ است</p>
        </div>
    </div>

    <script>
        // Auto redirect after 5 seconds
        setTimeout(function() {
            window.location.href = "{% url 'emergency_services:emergency_login' %}";
        }, 5000);
    </script>
</body>
</html>
