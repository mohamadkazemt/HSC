{% extends 'emergency_services/emergency_base.html' %}
{% block title %}افزودن دارو به مراجعه{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto rounded-lg shadow-lg bg-white dark:bg-gray-800">
  <div class="p-4 rounded-t-lg bg-gradient-to-l from-amber-50 to-white dark:from-gray-800 dark:to-gray-800 border-b border-gray-100 dark:border-gray-700 flex items-center gap-2">
    <i class="fa-solid fa-capsules text-amber-600"></i>
    <h3 class="font-semibold">افزودن دارو به مراجعه</h3>
  </div>
  <form method="post" class="p-4 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm mb-1">دارو</label>
      {{ form.medicine }}
    </div>
    <div>
      <label class="block text-sm mb-1">تعداد</label>
      {{ form.quantity }}
    </div>
    <div class="flex items-center justify-end gap-2">
      <a href="{% url 'emergency_services:visit_detail' visit.id %}" class="px-4 py-2 rounded-md bg-gray-100 text-gray-700">انصراف</a>
      <button type="submit" class="px-4 py-2 rounded-md bg-amber-600 text-white">افزودن</button>
    </div>
  </form>
</div>
{% endblock %}
