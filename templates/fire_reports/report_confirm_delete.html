{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full text-center">
    <i class="fa fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
    <h2 class="text-xl font-bold mb-2">حذف گزارش #{{ report.id }}</h2>
    <p class="mb-4">آیا از حذف این گزارش اطمینان دارید؟ این عمل قابل بازگشت نیست.</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex justify-center gap-4 mt-4">
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded">تأیید و حذف</button>
        <a href="{% url 'fire_reports:report_detail' report.id %}" class="bg-gray-200 px-6 py-2 rounded">انصراف</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
