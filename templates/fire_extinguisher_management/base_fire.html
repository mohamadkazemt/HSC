{% extends 'base.html' %}
{% load static %}

{% block styles %}
  {{ block.super }}
  <style>
    .persian-datepicker-input {
      text-align: center;
    }
    .select2-container--classic .select2-selection--single {
      height: 44px !important;
      padding: 5px 10px !important;
      border-radius: 0.5rem !important;
    }
    .select2-container--classic .select2-selection--single .select2-selection__arrow {
      height: 36px !important;
    }
    .select2-container--classic .select2-search--dropdown .select2-search__field {
      border-radius: 0.375rem;
    }
    .select2-container--classic .select2-results__option--highlighted[aria-selected] {
      background-color: #4f46e5 !important;
    }
    /* Global form field normalization for consistent appearance */
    input[type="text"], input[type="number"], input[type="date"], textarea, select {
      background-color: #ffffff;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db; /* gray-300 */
      border-radius: 0.5rem;
      line-height: 1.25;
      height: 44px;
      box-sizing: border-box;
      color: inherit;
      font-size: 0.9375rem; /* 15px */
    }
    textarea { height: auto; min-height: 80px; padding-top: 0.5rem; padding-bottom: 0.5rem; }
    select { background-image: none; }
    /* Remove native number input spinners */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  input[type="number"] { -moz-appearance: textfield; appearance: none; -webkit-appearance: none; }
    /* When Select2 is not active, ensure select shows like inputs */
    select:not(.select2-hidden-accessible) { appearance: none; -webkit-appearance: none; }
  </style>
{% endblock %}

{% block scripts %}
  {{ block.super }}
  <!-- SweetAlert2 for nice alerts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Initialize Select2
      $('select').select2({
        width: '100%',
        dir: 'rtl',
        theme: 'classic',
        language: {
          noResults: function() {
            return "موردی یافت نشد";
          }
        }
      });

      // Initialize Persian Datepicker
      $('.persian-datepicker').each(function() {
        $(this).persianDatepicker({
          format: 'YYYY/MM/DD',
          autoClose: true,
          initialValueType: 'gregorian',
          persianDigit: false,
          observer: true,
          calendar: {
            persian: {
              locale: 'fa'
            }
          }
        });
      });
    });
  </script>
{% endblock %}

{% block content %}
  {% block fire_content %}{% endblock %}
{% endblock %}
