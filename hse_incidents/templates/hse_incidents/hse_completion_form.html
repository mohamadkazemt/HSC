<form method="post" enctype="multipart/form-data" id="completion-form" {% if report %}action="{% url 'hse_incidents:submit_completion' report.id %}"{% else %}action="{{ request.path }}"{% endif %}>
    {% csrf_token %}
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">زمان‌ها</h5>
        
        <div class="col-md-6 mb-4">
            <label class="form-label">ساعت اعلام حادثه</label>
            <input type="time" name="incident_report_time" class="form-control">
        </div>
        
        <div class="col-md-6 mb-4">
            <label class="form-label">ساعت پذیرش در بیمارستان</label>
            <input type="time" name="hospital_admission_time" class="form-control">
        </div>
    </div>
    
    <div class="separator my-6"></div>
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">شرح حال بیمار</h5>
        
        <div class="col-md-3 mb-4">
            <label class="form-label">دمای بدن</label>
            <input type="text" name="patient_condition_temperature" class="form-control" placeholder="مثال: 37">
        </div>
        
        <div class="col-md-3 mb-4">
            <label class="form-label">تعداد تنفس</label>
            <input type="text" name="patient_condition_respiration" class="form-control" placeholder="مثال: 18">
        </div>
        
        <div class="col-md-3 mb-4">
            <label class="form-label">نبض</label>
            <input type="text" name="patient_condition_pulse" class="form-control" placeholder="مثال: 80">
        </div>
        
        <div class="col-md-3 mb-4">
            <label class="form-label">فشار خون</label>
            <input type="text" name="patient_condition_blood_pressure" class="form-control" placeholder="مثال: 120/80">
        </div>
        
        <div class="col-md-12 mb-4">
            <label class="form-label">وضعیت هوشیاری</label>
            <input type="text" name="patient_condition_sop" class="form-control" placeholder="مثال: هوشیار، نیمه هوشیار، بیهوش">
        </div>
    </div>
    
    <div class="separator my-6"></div>
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">تحلیل علل حادثه</h5>
        
        <div class="col-md-12 mb-4">
            <label class="form-label">علل مستقیم بروز حادثه</label>
            <textarea name="direct_causes" class="form-control" rows="3"></textarea>
        </div>
        
        <div class="col-md-12 mb-4">
            <label class="form-label">علل غیر مستقیم بروز حادثه</label>
            <textarea name="indirect_causes" class="form-control" rows="3"></textarea>
        </div>
        
        <div class="col-md-12 mb-4">
            <label class="form-label">علل ریشه‌ای بروز حادثه</label>
            <textarea name="root_causes" class="form-control" rows="3"></textarea>
        </div>
    </div>
    
    <div class="separator my-6"></div>
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">اعلام به مراجع</h5>
        
        <div class="col-md-6 mb-4">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="social_security_notification" id="social_security_notification">
                <label class="form-check-label">اعلام به بیمه تامین اجتماعی</label>
            </div>
            <input type="file" name="social_security_file" class="form-control" id="social_security_file" style="display:none;">
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="insurance_notification" id="insurance_notification">
                <label class="form-check-label">اعلام به شرکت‌های بیمه‌ای</label>
            </div>
            <input type="file" name="insurance_file" class="form-control" id="insurance_file" style="display:none;">
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="police_notification" id="police_notification">
                <label class="form-check-label">اعلام به نیروی انتظامی</label>
            </div>
            <input type="file" name="police_file" class="form-control" id="police_file" style="display:none;">
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="traffic_police_notification" id="traffic_police_notification">
                <label class="form-check-label">اعلام به راهنمایی و رانندگی</label>
            </div>
            <input type="file" name="traffic_police_file" class="form-control" id="traffic_police_file" style="display:none;">
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="labor_office_notification">
                <label class="form-check-label">اعلام به اداره کار</label>
            </div>
        </div>
    </div>
    
    <div class="separator my-6"></div>
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">نتایج و هزینه‌ها</h5>
        
        <div class="col-md-12 mb-4">
            <label class="form-label">نتیجه نهایی آسیب‌های ناشی از حادثه</label>
            <textarea name="final_injury_outcome" class="form-control" rows="3"></textarea>
        </div>
        
        <div class="col-md-6 mb-4">
            <label class="form-label">برآورد هزینه تقریبی</label>
            <input type="text" name="estimated_cost" class="form-control" placeholder="مثال: 10,000,000 ریال">
        </div>
        
        <div class="col-md-6 mb-4">
            <label class="form-label">روزهای کاری از دست رفته</label>
            <input type="number" name="lost_workdays" class="form-control" placeholder="تعداد روز">
        </div>
    </div>
    
    <div class="separator my-6"></div>
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">آسیب محیط زیستی</h5>
        
        <div class="col-md-12 mb-4">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="environmental_damage" id="environmental_damage">
                <label class="form-check-label">آسیب به محیط زیست دارد؟</label>
            </div>
        </div>
        
        <div id="environmental_fields" style="display:none;">
            <div class="col-md-12 mb-4">
                <label class="form-label">نوع آسیب به محیط زیست</label>
                <input type="text" name="environmental_damage_type" class="form-control">
            </div>
            
            <div class="col-md-12 mb-4">
                <label class="form-label">شرح مختصر آسیب وارد شده به محیط زیست</label>
                <textarea name="environmental_damage_description" class="form-control" rows="3"></textarea>
            </div>
        </div>
    </div>
    
    <div class="separator my-6"></div>
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">کمیته حوادث</h5>
        
        <div class="col-md-12 mb-4">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" name="incident_committee_formed" id="incident_committee_formed">
                <label class="form-check-label">کمیته حوادث تشکیل گردید؟</label>
            </div>
        </div>
        
        <div id="committee_fields" style="display:none;">
            <div class="col-md-6 mb-4">
                <label class="form-label">تاریخ برگزاری کمیته حوادث</label>
                <input type="text" name="incident_committee_date" id="incident_committee_date" class="form-control" autocomplete="off" data-jdp>
            </div>
            
            <div class="col-md-12 mb-4">
                <label class="form-label">شرح مختصر جزئیات کمیته حوادث</label>
                <textarea name="incident_committee_details" class="form-control" rows="3"></textarea>
            </div>
            
            <div class="col-md-12 mb-4">
                <label class="form-label">پیوست صورتجلسه کمیته حوادث</label>
                <input type="file" name="incident_committee_file" class="form-control">
            </div>
        </div>
    </div>
    
    <div class="separator my-6"></div>
    
    <div class="row mb-6">
        <h5 class="text-primary mb-4">اقدامات و درس آموزی</h5>
        
        <div class="col-md-12 mb-4">
            <label class="form-label">اقدامات اصلاحی و پیشگیرانه</label>
            <textarea name="corrective_actions" class="form-control" rows="4"></textarea>
        </div>
        
        <div class="col-md-12 mb-4">
            <div class="form-check form-switch mb-2">
                <input class="form-check-input" type="checkbox" name="lessons_learned" id="lessons_learned">
                <label class="form-check-label">درس آموزی از حادثه دارد؟</label>
            </div>
            <input type="file" name="lessons_learned_file" class="form-control" id="lessons_learned_file" style="display:none;">
        </div>
    </div>
    
    <div class="d-flex justify-content-end gap-3">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">انصراف</button>
        <button type="submit" class="btn btn-primary">
            <i class="ki-outline ki-check fs-2"></i>
            ثبت اطلاعات تکمیلی
        </button>
    </div>
</form>

<script>
$(document).ready(function() {
    // نمایش/مخفی فیلدهای فایل
    $('#social_security_notification').on('change', function() {
        $('#social_security_file').toggle($(this).is(':checked'));
    });
    
    $('#insurance_notification').on('change', function() {
        $('#insurance_file').toggle($(this).is(':checked'));
    });
    
    $('#police_notification').on('change', function() {
        $('#police_file').toggle($(this).is(':checked'));
    });
    
    $('#traffic_police_notification').on('change', function() {
        $('#traffic_police_file').toggle($(this).is(':checked'));
    });
    
    $('#lessons_learned').on('change', function() {
        $('#lessons_learned_file').toggle($(this).is(':checked'));
    });
    
    // نمایش/مخفی فیلدهای آسیب محیط زیستی
    $('#environmental_damage').on('change', function() {
        $('#environmental_fields').toggle($(this).is(':checked'));
    });
    
    // نمایش/مخفی فیلدهای کمیته حوادث
    $('#incident_committee_formed').on('change', function() {
        $('#committee_fields').toggle($(this).is(':checked'));
    });
});
</script>

<script>
$(document).ready(function() {
    const formEl = document.getElementById('completion-form');
    if (!formEl) return;
    formEl.addEventListener('submit', async function(e) {
        e.preventDefault();
        const submitBtn = formEl.querySelector('button[type="submit"]');
        submitBtn && submitBtn.setAttribute('data-kt-indicator', 'on');
        submitBtn && (submitBtn.disabled = true);
        const formData = new FormData(formEl);
        const actionUrl = formEl.getAttribute('action') || window.location.href;
        const csrftoken = formEl.querySelector('[name="csrfmiddlewaretoken"]').value;
        try {
            const resp = await fetch(actionUrl, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': csrftoken
                },
                credentials: 'same-origin'
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const data = await resp.json();
            if (data.status === 'success' && data.redirect) {
                window.location.href = data.redirect;
            } else {
                toastr.error(data.message || 'خطا در ثبت اطلاعات');
            }
        } catch (err) {
            // در صورت بروز خطا، ارسال معمولی انجام شود
            formEl.submit();
        } finally {
            submitBtn && submitBtn.setAttribute('data-kt-indicator', 'off');
            submitBtn && (submitBtn.disabled = false);
        }
    });
});
</script>
